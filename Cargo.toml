[package]
name = "cosmic-taskbar"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "The COSMIC panel as on Windows 11 and macOS: taskbar, Start menu, quick settings, side panels, tray, notifications, clipboard, Logitech devices; one program"

[dependencies]
calloop = "0.14"
cosmic-settings-a11y-manager-subscription = { git = "https://github.com/pop-os/cosmic-settings", rev = "ae5c750" }
cosmic-settings-accessibility-subscription = { git = "https://github.com/pop-os/cosmic-settings", rev = "ae5c750" }
serde_json = "1"
udev = "0.9.3"
anyhow = "1.0.102"
cctk = { git = "https://github.com/pop-os/cosmic-protocols", package = "cosmic-client-toolkit", rev = "c0cff4d" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols", default-features = false, features = [
    "client",
], rev = "c0cff4d" }
fastrand = "2.3.0"
futures = "0.3"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "applet",
    "applet-token",
    "dbus-config",
    "desktop",
    "desktop-systemd-scope",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
] }
memmap2 = "0.9.10"
resvg = "=0.45.1"
rustc-hash = "2.1"
rustix = { version = "1.1", features = ["event", "fs", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
shlex = "1.3"
switcheroo-control = { git = "https://github.com/pop-os/dbus-settings-bindings" }
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2.5.8"
zbus = { version = "5.14.0", default-features = false, features = ["tokio", "p2p"] }

[dev-dependencies]
iced_tiny_skia = { git = "https://github.com/pop-os/libcosmic" }

[profile.release]
opt-level = 3
panic = "abort"
lto = "thin"
# File and line in a panic's backtrace (the journal shows where a part crashed); the
# tables stay on disk, not in the memory the program uses.
debug = "line-tables-only"

# Same pins as cosmic-applets epoch-1.10.0, to match the installed panel.
[patch."https://github.com/smithay/client-toolkit.git"]
sctk = { package = "smithay-client-toolkit", version = "0.20.0" }

[patch."https://github.com/pop-os/cosmic-protocols"]
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "c0cff4d" }
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "c0cff4d" }

# Patched tiny-skia renderer (damage bounding box, cheaper clip mask): OFF for
# now. With it the taskbar's preview showed huge borders, probably its shadows
# drawn again over the last frame's; see third_party/libcosmic-patches and
# scripts/libcosmic-patched.sh before turning it back on.
# [patch."https://github.com/pop-os/libcosmic"]
# iced_tiny_skia = { path = ".build/libcosmic-patched/iced/tiny_skia" }
