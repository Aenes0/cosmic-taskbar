<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.Aenes0.EconomiaEnergia"/>
    <allow send_destination="io.github.Aenes0.EconomiaEnergia"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.Aenes0.EconomiaEnergia"
           send_interface="io.github.Aenes0.EconomiaEnergia"
           send_member="SetProfile"/>
    <allow send_destination="io.github.Aenes0.EconomiaEnergia"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
